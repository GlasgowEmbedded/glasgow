[project]
requires-python = "~=3.13"
dependencies = [
    "sphinx>=8.1",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-inline-tabs",
    "sphinx-copybutton",
    "sphinx-intl",
    "sphinxcontrib-autoprogram",
    "enum-tools[sphinx]",
    # If you change the version of Furo, check out the repository, apply the following patch
    # to `src/furo/assets/styles/variables/_layout.scss`:
    #   -$sidebar-width: 15em;
    #   +$sidebar-width: 16em;
    # then rebuild it and place the build product `src/furo/theme/furo/static/styles/furo.css`
    # into `docs/manual/src/_static/styles/furo.css`.
    "furo==2025.12.19",
    "glasgow @ file:///${PROJECT_ROOT}/../../software"
]

[tool.pdm.scripts]
live.cmd = "sphinx-autobuild src build --watch ../../software/glasgow"
build.cmd = "sphinx-build src build -b html"
live-zh = { cmd = "sphinx-autobuild src build-zh --watch ../../software/glasgow", env = {"DOCS_LANGUAGE" = "zh"} }
build-zh = { cmd = "sphinx-build src build-zh -b html", env = {"DOCS_LANGUAGE" = "zh"} }

check.cmd = "sphinx-build src check -b linkcheck"
gettext.cmd = "sphinx-build src locale/pot -b gettext"
update-zh.cmd = "sphinx-intl update -d locale -l zh -w 0"
i18n = {composite = ["gettext", "update-zh"]}
