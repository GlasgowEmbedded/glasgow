<div class="language-selector">
    <span class="language-selector-label" role="heading"><i class="fa-solid fa-globe"></i> {{ _("Language") }}</span>
    <ul>
        {% for code, name in languages.items() %}
            {% if language == code %}
                <li aria-current="true">{{ name }}</li>
            {% else %}
                <li>
                    <a href="/{{ code }}/{{ pagename }}.html" lang="{{ code }}" hreflang="{{ code }}">
                        {{ name }}
                    </a>
                </li>
            {% endif %}
        {% endfor %}
    </ul>
</div>
